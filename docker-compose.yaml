volumes:
  metadata_data: {}
  middle_var: {}
  historical_var: {}
  broker_var: {}
  coordinator_var: {}
  router_var: {}
  druid_shared: {}
  zookeeper_data: {}
  zookeeper_log: {}
  dagster_data: {}
networks:
  druid-net:
    driver: bridge
services:
  zookeeper-kafka:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: zookeeper-kafka
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xms128M -Xmx128M
      TZ: America/Sao_Paulo
    ports:
    - 22181:2181
    networks:
    - druid-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    ports:
    - 9092:9092
    - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-kafka:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xms256M -Xmx256M
      TZ: America/Sao_Paulo
    depends_on:
    - zookeeper-kafka
    networks:
    - druid-net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
  postgres:
    container_name: postgres
    image: postgres:latest
    ports:
    - 5432:5432
    volumes:
    - metadata_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: druid
      POSTGRES_USER: druid
      POSTGRES_DB: druid
      TZ: America/Sao_Paulo
    networks:
    - druid-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  coordinator:
    image: apache/druid:34.0.0
    container_name: coordinator
    user: 0:0
    volumes:
    - druid_shared:/opt/shared
    - coordinator_var:/opt/druid/var
    - ./pipelines/silver/data:/opt/pipelines/silver/data
    - ./pipelines/gold/data:/opt/pipelines/gold/data
    depends_on:
    - zookeeper-kafka
    - postgres
    ports:
    - 8081:8081
    command:
    - coordinator
    env_file:
    - .env
    environment:
      JAVA_OPTS: -Xms128m -Xmx256m -Duser.timezone=America/Sao_Paulo
      TZ: America/Sao_Paulo
    networks:
    - druid-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
  broker:
    image: apache/druid:34.0.0
    container_name: broker
    user: 0:0
    volumes:
    - broker_var:/opt/druid/var
    - druid_shared:/opt/shared
    - ./pipelines/silver/data:/opt/pipelines/silver/data
    - ./pipelines/gold/data:/opt/pipelines/gold/data
    depends_on:
    - zookeeper-kafka
    - postgres
    - coordinator
    ports:
    - 8082:8082
    command:
    - broker
    env_file:
    - .env
    environment:
      JAVA_OPTS: -Xms${DRUID_BROKER_XMS:-256m} -Xmx${DRUID_BROKER_XMX:-512m}
        -XX:MaxDirectMemorySize=${DRUID_BROKER_DIRECT:-512m} -Duser.timezone=America/Sao_Paulo
        -Ddruid.lookup.enableLookupSyncOnStartup=true
      druid_processing_buffer_sizeBytes: ${DRUID_BROKER_BUFFER_BYTES:-67108864}
      druid_processing_numThreads: ${DRUID_BROKER_PROCESSING_THREADS:-1}
      druid_processing_numMergeBuffers: ${DRUID_BROKER_MERGE_BUFFERS:-1}
      druid_query_groupBy_maxOnDiskStorage: ${DRUID_BROKER_GROUPBY_MAX_DISK:-1073741824}
      druid_query_subquery_maxBytes: auto
      druid_server_http_maxSubqueryRows: 5000000
      TZ: America/Sao_Paulo
    networks:
    - druid-net
    cpus: ${DRUID_BROKER_CPUS:-1.0}
    mem_limit: ${DRUID_BROKER_MEMORY:-768M}
    deploy:
      resources:
        limits:
          cpus: ${DRUID_BROKER_CPUS:-1.0}
          memory: ${DRUID_BROKER_MEMORY:-768M}
  historical:
    image: apache/druid:34.0.0
    container_name: historical
    user: 0:0
    volumes:
    - druid_shared:/opt/shared
    - historical_var:/opt/druid/var
    - ./pipelines/silver/data:/opt/pipelines/silver/data
    - ./pipelines/gold/data:/opt/pipelines/gold/data
    depends_on:
    - zookeeper-kafka
    - postgres
    - coordinator
    ports:
    - 8083:8083
    command:
    - historical
    env_file:
    - .env
    environment:
      JAVA_OPTS: -Xms${DRUID_HISTORICAL_XMS:-256m} -Xmx${DRUID_HISTORICAL_XMX:-512m}
        -XX:MaxDirectMemorySize=${DRUID_HISTORICAL_DIRECT:-512m}
        -Duser.timezone=America/Sao_Paulo
        -Ddruid.lookup.enableLookupSyncOnStartup=true
      druid_processing_buffer_sizeBytes: ${DRUID_HISTORICAL_BUFFER_BYTES:-67108864}
      druid_processing_numThreads: ${DRUID_HISTORICAL_PROCESSING_THREADS:-1}
      druid_processing_numMergeBuffers: ${DRUID_HISTORICAL_MERGE_BUFFERS:-1}
      druid_query_groupBy_maxOnDiskStorage: ${DRUID_HISTORICAL_GROUPBY_MAX_DISK:-1073741824}
      TZ: America/Sao_Paulo
    networks:
    - druid-net
    cpus: ${DRUID_HISTORICAL_CPUS:-1.0}
    mem_limit: ${DRUID_HISTORICAL_MEMORY:-768M}
    deploy:
      resources:
        limits:
          cpus: ${DRUID_HISTORICAL_CPUS:-1.0}
          memory: ${DRUID_HISTORICAL_MEMORY:-768M}
  middlemanager:
    image: apache/druid:34.0.0
    container_name: middlemanager
    user: 0:0
    volumes:
    - druid_shared:/opt/shared
    - middle_var:/opt/druid/var
    - ./pipelines/silver/data:/opt/pipelines/silver/data
    - ./pipelines/gold/data:/opt/pipelines/gold/data
    depends_on:
    - zookeeper-kafka
    - postgres
    - coordinator
    ports:
    - 8091:8091
    - 8100-8105:8100-8105
    command:
    - middleManager
    env_file:
    - .env
    environment:
      JAVA_OPTS: -Xms128m -Xmx128m -Duser.timezone=America/Sao_Paulo
      druid_worker_capacity: 2
      druid_indexer_runner_javaOpts: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=128m -Duser.timezone=America/Sao_Paulo
      druid_indexer_fork_property_druid_processing_numThreads: 1
      druid_indexer_fork_property_druid_processing_numMergeBuffers: 1
      druid_indexer_fork_property_druid_processing_buffer_sizeBytes: 33554432
      TZ: America/Sao_Paulo
    networks:
    - druid-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
  router:
    image: apache/druid:34.0.0
    container_name: router
    user: 0:0
    volumes:
    - router_var:/opt/druid/var
    - druid_shared:/opt/shared
    - ./pipelines/silver/data:/opt/pipelines/silver/data
    - ./pipelines/gold/data:/opt/pipelines/gold/data
    depends_on:
    - zookeeper-kafka
    - postgres
    - coordinator
    - broker
    - historical
    ports:
    - 8888:8888
    command:
    - router
    env_file:
    - .env
    environment:
      JAVA_OPTS: -Xms128m -Xmx128m -Duser.timezone=America/Sao_Paulo
      TZ: America/Sao_Paulo
    networks:
    - druid-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M
  superset:
    build:
      context: ./infrastructure/superset
    image: custom-superset:v4
    container_name: superset
    ports:
    - 8088:8088
    networks:
    - druid-net
    environment:
      SUPERSET_SECRET_KEY: minha-chave-secreta-ic-dataops-unifei
      TZ: America/Sao_Paulo
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://druid:druid@postgres:5432/druid
      SUPERSET_WEBSERVER_TIMEOUT: 300
    depends_on:
    - postgres
    - broker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
  dagster:
    build:
      context: .
      dockerfile: infrastructure/dagster/Dockerfile
    image: ic-dataops-dagster:local
    container_name: dagster
    ports:
    - 3000:3000
    volumes:
    - ./pipelines:/opt/dagster/app/pipelines
    - ./config:/opt/dagster/app/config
    - dagster_data:/opt/dagster/dagster_home
    - ./pipelines/silver/data:/opt/dagster/app/pipelines/silver/data
    - ./pipelines/gold/data:/opt/dagster/app/pipelines/gold/data
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      TZ: America/Sao_Paulo
      PYTHONPATH: /opt/dagster/app
    working_dir: /opt/dagster/app
    command:
    - uv
    - run
    - dagster
    - dev
    - -h
    - 0.0.0.0
    - -p
    - '3000'
    - -m
    - pipelines.orchestration.repo
    networks:
    - druid-net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
